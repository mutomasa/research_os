[project]
name = "research-os"
version = "0.1.0"
description = "Research OS — 検索から実験・投稿までを回す研究開発 TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "textual>=0.80",
]

[project.scripts]
research-os = "research_os.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
