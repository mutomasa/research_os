# Venue レジストリ（学術誌・国際会議）
#
# 仕様: docs/new_features/venue_strategy.md §3 / docs/design.md §2.7 / ADR-0001
# 出典: docs/reference/paper_strategy.md §2（学術誌 10）・§3（国際会議 5）・§6（優先順位）
#
# スキーマ
#   venue_id      一意な ID（小文字・英数字・アンダースコア）
#   name          正式名称
#   abbrev        略称（なければ null）
#   type          journal | conference | magazine
#   publisher     出版元・主催
#   ieee_related  IEEE 関連か
#   scope         主な研究領域（タグ）
#   fit           研究テーマとの相性の既定値（◎ | ○ | △）。research/profile.yaml の venue_overrides で上書きする
#   priority      投稿優先度の既定値（1 が最優先。未設定は null）
#   tier          投稿戦略上の位置付け（first_result | foundational | mature_journal | null）
#   links         公式サイト・CFP・投稿規定の URL（未確認は null）
#   identifiers   取得元ごとの識別子（issn / openalex: OpenAlex source ID / dblp: DBLP のキー）。ADR-0003
#                 openalex は 2026-10-25 に ISSN・名称から解決して確認済み。dblp は未確認のため null
#   policies      投稿規定の要点（年度で変わるため verified で確認状態を持つ）
#   deadlines     年度ごとの締切（Phase C の巡回で更新する。手で推測値を入れない）
#   source_url / retrieved_at / updated_at  来歴
#
# 注意: policies・deadlines は公式ページで確認するまで verified: false のままにする。

schema_version: 1

